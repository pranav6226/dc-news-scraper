# Daily digest: curated operator RSS manifests → Markdown + Slack (no NewsAPI).
# Schedule uses UTC. Edit cron to change cadence.
name: Daily data center news monitor

on:
  schedule:
    - cron: "0 15 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  monitor:
    runs-on: ubuntu-latest
    env:
      FEED_URLS: ${{ vars.FEED_URLS }}
      KEYWORDS: ${{ vars.KEYWORDS }}
      TOPIC_RELAX_HOSTS: ${{ vars.TOPIC_RELAX_HOSTS }}
      OUTAGE_SIGNALS: ${{ vars.OUTAGE_SIGNALS }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      REQUIRE_SLACK_WEBHOOK: "true"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Regenerate company feed manifest from CSV
        run: python scripts/generate_company_feeds.py

      - name: Run monitor
        run: python monitor.py

      - name: Upload Markdown digest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-digest-${{ github.run_id }}
          path: reports/daily_report_*.md
          if-no-files-found: warn
